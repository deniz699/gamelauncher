name: APK derle ve yayınla

on:
  push:
  workflow_dispatch:

env:
  RELEASES_REPO: ${{ github.repository_owner }}/gamelauncher-releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını belirle
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          LAST=$(gh release list --repo "$RELEASES_REPO" --limit 1 --json tagName -q '.[0].tagName' || true)
          if [[ "$LAST" =~ ^v1\.0\.([0-9]+)-[0-9]+$ ]]; then PATCH=$((BASH_REMATCH[1] + 1)); else PATCH=0; fi
          echo "APP_VERSION=1.0.${PATCH}" >> "$GITHUB_ENV"
          echo "Bu derlemenin sürümü: 1.0.${PATCH}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/debug/app-debug.apk GameLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameLauncher-apk
          path: GameLauncher.apk

      - name: Herkese açık depoda sürüm yayınla
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="$APP_VERSION"
          gh release create "v${VERSION}-${GITHUB_RUN_NUMBER}" GameLauncher.apk \
            --repo "$RELEASES_REPO" \
            --title "Game Launcher ${VERSION}" \
            --notes "" \
            --latest
