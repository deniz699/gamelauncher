name: APK derle ve yayınla

on:
  push:
  workflow_dispatch:

env:
  # Yalnızca APK'ların durduğu herkese açık depo: kullanici/gamelauncher-releases
  RELEASES_REPO: ${{ github.repository_owner }}/gamelauncher-releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/debug/app-debug.apk GameLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameLauncher-apk
          path: GameLauncher.apk

      - name: Herkese açık depoda sürüm yayınla (yalnızca APK)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" GameLauncher.apk \
            --repo "$RELEASES_REPO" \
            --title "Sürüm 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Game Launcher 1.0.${GITHUB_RUN_NUMBER}" \
            --latest
